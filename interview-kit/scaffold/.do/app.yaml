# App Platform spec, build-from-GitHub flavor (the default): App Platform clones
# the repo, builds backend/Dockerfile and redeploys on every push to main
# (deploy_on_push) -- no CI, registry or local Docker needed. `make app-create`
# fills ${GITHUB_REPO} and applies it; re-run it after editing this file (a push
# redeploys code, not spec changes). GIT_SHA comes from App Platform's
# ${_self.COMMIT_HASH}, so /version still names the live commit.
# .do/app.image.yaml is the prebuilt-image flavor (CI / make app-deploy).
name: interview-app
region: nyc
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
envs:
  - key: APP_ENV
    value: prod
    scope: RUN_TIME
  - key: LOG_LEVEL
    value: INFO
    scope: RUN_TIME
  - key: DATABASE_URL
    value: ${db.DATABASE_URL}
    scope: RUN_TIME
  - key: REDIS_URL
    value: ${cache.DATABASE_URL}
    scope: RUN_TIME
  - key: API_KEYS  # name:key[:limit],... filled from your shell/CI secret; DO stores it encrypted
    value: ${API_KEYS}
    type: SECRET
    scope: RUN_TIME
services:
  - name: api
    github:
      repo: ${GITHUB_REPO}
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    envs:
      - key: GIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
    http_port: 8000
    instance_count: 2  # >1 = zero-downtime rolling deploys, survives one instance dying
    instance_size_slug: apps-s-1vcpu-1gb
    health_check:  # readiness: gates traffic during rollout; a DB outage drains the instance
      http_path: /ready
    liveness_health_check:  # restart only if the process itself is wedged
      http_path: /health
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
      - rule: REQUEST_DURATION_P95_MS
        operator: GREATER_THAN
        value: 500
        window: FIVE_MINUTES
workers:
  - name: worker  # ingestion add-on (section 4.20); same Dockerfile, different command
    github:
      repo: ${GITHUB_REPO}
      branch: main
      deploy_on_push: true
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    envs:
      - key: GIT_SHA
        value: ${_self.COMMIT_HASH}
        scope: RUN_TIME
    run_command: python -m app.worker
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
databases:
  # Attaching an existing managed cluster (infra/main.tf) also adds the app as
  # a trusted source, so the DB accepts connections only from this app.
  - name: db
    engine: PG
    production: true
    cluster_name: interview-pg
  - name: cache
    engine: VALKEY
    production: true
    cluster_name: interview-cache
